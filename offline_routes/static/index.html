<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Route Planner</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="masthead">
  <h1>Offline Route Planner</h1>
  <p class="lede">Plan the shortest walk between landmarks. Everything runs on this computer.</p>
</header>
<main class="layout">
  <div class="col col-controls">
    <section class="panel" aria-labelledby="plan-h">
      <h2 id="plan-h">Plan a route</h2>
      <form id="route-form" novalidate>
        <div class="field">
          <label for="from">From</label>
          <select id="from" name="from">
            <option value="">Choose a landmark</option>
          </select>
        </div>
        <div class="field">
          <label for="to">To</label>
          <select id="to" name="to">
            <option value="">Choose a landmark</option>
          </select>
        </div>
        <button type="submit" id="calculate" class="primary">Calculate route</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="route-h">
      <h2 id="route-h">Route</h2>
      <p id="steps-empty" class="muted">No route shown yet.</p>
      <ol id="steps" aria-label="Route steps" hidden></ol>
      <p id="total" class="total" hidden></p>
      <form id="save-form" novalidate>
        <div class="field">
          <label for="title">Route title</label>
          <input id="title" name="title" type="text" maxlength="80" autocomplete="off">
        </div>
        <button type="submit" id="save" disabled>Save route</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="saved-h">
      <h2 id="saved-h">Saved routes</h2>
      <ul id="saved" class="saved"></ul>
    </section>
  </div>

  <div class="col col-map">
    <section class="panel" aria-labelledby="map-h">
      <h2 id="map-h">Map</h2>
      <div id="map-wrap" class="map-wrap">
        <canvas id="map" role="img" width="400" height="260" aria-label="Map of landmarks"></canvas>
      </div>
      <h3 id="edges-h">Connections</h3>
      <ul id="edges" aria-labelledby="edges-h"></ul>
    </section>
  </div>
</main>
</body>
</html>
